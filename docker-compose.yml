services:
  postgres:
    image: postgres:17-alpine
    container_name: tixing-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: tixing
      POSTGRES_USER: tixing
      POSTGRES_PASSWORD: tixing_dev_password
    ports:
      - "54329:5432"
    volumes:
      - tixing_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tixing -d tixing"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  tixing_postgres_data:
